name: Build and release

on:
  push:
    branches: [main, dev, lenotch-rewrite]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-26
    permissions:
      contents: write  # to publish releases for version tags
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # tags and history for the release notes

      # Liquid Glass needs the macOS 26 SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install DMG builder
        run: brew install create-dmg

      # A fixed signing certificate, so macOS keeps Lenotch's permissions across updates
      # (ad-hoc signatures change with every build). Skipped where the secrets aren't
      # available, e.g. pull requests from forks.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.LENOTCH_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.LENOTCH_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "No signing certificate; building ad-hoc."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/lenotch.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/lenotch.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/lenotch.p12"
          security find-identity -p codesigning "$KEYCHAIN"

      - name: Build universal DMG
        env:
          ARCHS: arm64 x86_64
          BUILD: ${{ github.run_number }}
        run: |
          # Version tags like v2.1 set the app version to 2.1.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./build.sh dmg
          codesign -dvv build/Lenotch.app 2>&1 | grep -E "Authority|Signature"

      - name: Checksum
        run: shasum -a 256 build/Lenotch.dmg > build/Lenotch.dmg.sha256

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME"

      - name: Sign update and generate appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --embed-release-notes \
            --download-url-prefix "https://github.com/lephorx/lenotch/releases/download/${GITHUB_REF_NAME}/" \
            build

      - uses: actions/upload-artifact@v6
        with:
          name: Lenotch
          path: |
            build/Lenotch.dmg
            build/Lenotch.dmg.sha256
            build/appcast.xml
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Lenotch.dmg
            build/Lenotch.dmg.sha256
            build/appcast.xml
          body_path: build/release-notes.md

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # One self-contained Lenotch.exe (no .NET install needed). Version tags like
      # v2.10 set the exe's version, which the in-app updater compares against.
      - name: Build Lenotch.exe
        shell: bash
        run: |
          VERSION_ARGS=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_ARGS+=("-p:Version=${GITHUB_REF_NAME#v}")
          fi
          dotnet publish windows/Lenotch.csproj -c Release -r win-x64 "${VERSION_ARGS[@]}" -o dist
          ls -la dist

      # Starts the exe, drives it through its debug hooks and renders the notch's
      # states to PNGs, so a startup crash or broken layout shows up here.
      - name: Smoke test
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "lenotch"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $env:LENOTCH_DEBUG_DIR = $dir
          $cmd = Join-Path $dir "lenotch-cmd.txt"
          $app = Start-Process -FilePath "dist\Lenotch.exe" -PassThru
          function Send($text) { Set-Content -Path $cmd -Value $text; Start-Sleep -Seconds 2 }
          Start-Sleep -Seconds 10
          Send "snap closed"
          Send "hold"
          Send "snap player"
          Send "page 1"
          Send "snap shelf"
          Send "ai on"
          Send "page 2"
          Send "snap ai"
          Send "page 0"
          Send "timerpanel"
          Send "snap timerpanel"
          Send "release"
          Send "close"
          Send "timer 30"
          Send "snap timer"
          Send "settings general"
          Send "snap general"
          Send "settings aiusage"
          Send "snap aisettings"
          Start-Sleep -Seconds 1
          Get-Content (Join-Path $dir "lenotch-debug.txt") -ErrorAction SilentlyContinue
          $log = Join-Path $env:APPDATA "Lenotch\lenotch.log"
          if (Test-Path $log) { Get-Content $log; Copy-Item $log $dir }
          if ($app.HasExited) { Write-Error "Lenotch.exe exited (code $($app.ExitCode))"; exit 1 }
          Stop-Process -Id $app.Id
          if (Select-String -Path $log -Pattern "Unhandled|Fatal" -Quiet -ErrorAction SilentlyContinue) {
            Write-Error "Lenotch logged an unhandled exception"; exit 1
          }
          Get-ChildItem $dir

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: Lenotch-smoke-test
          path: ${{ runner.temp }}/lenotch

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\Lenotch.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Lenotch.exe" | Out-File -Encoding ascii dist\Lenotch.exe.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: Lenotch-Windows
          path: |
            dist/Lenotch.exe
            dist/Lenotch.exe.sha256
          if-no-files-found: error

  # Every release gets a direct Lenotch.exe download next to the DMG.
  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dmg, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Lenotch-Windows
          path: dist

      - name: Attach Lenotch.exe to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Lenotch.exe
            dist/Lenotch.exe.sha256
