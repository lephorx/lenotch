name: Build and release DMG

on:
  push:
    branches: [main, dev, lenotch-rewrite]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-26
    permissions:
      contents: write  # to publish releases for version tags
    steps:
      - uses: actions/checkout@v6

      # Liquid Glass needs the macOS 26 SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install DMG builder
        run: brew install create-dmg

      - name: Build universal DMG
        env:
          ARCHS: arm64 x86_64
          BUILD: ${{ github.run_number }}
        run: |
          # Version tags like v2.1 set the app version to 2.1.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./build.sh dmg

      - name: Checksum
        run: shasum -a 256 build/Lenotch.dmg > build/Lenotch.dmg.sha256

      - name: Sign update and generate appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            build

      - uses: actions/upload-artifact@v6
        with:
          name: Lenotch
          path: |
            build/Lenotch.dmg
            build/Lenotch.dmg.sha256
            build/appcast.xml
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Lenotch.dmg
            build/Lenotch.dmg.sha256
            build/appcast.xml
          generate_release_notes: true
